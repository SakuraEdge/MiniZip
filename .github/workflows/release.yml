name: Build and Release MiniZip
on:
  push:
    tags:
      - 'dev-v*'
      - 'rev-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Configure tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/configure-release.cjs
      - run: npm run setup:engine
      - run: npm run icons
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - name: Test packaged desktop application
        shell: pwsh
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $env:MINIZIP_PACKAGED_EXE = Join-Path $PWD "release/MiniZip-$($config.channel)-$($config.version)/MiniZip-win32-x64/MiniZip.exe"
          npm run test:desktop
      - run: npm run installer
      - name: Test installation and uninstallation
        shell: pwsh
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $installer = "release/MiniZip-$($config.channel)-$($config.version)/$($config.installerName)"
          ./scripts/test-installer.ps1 -Installer $installer
      - name: Test upgrade from Dev v1.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dev-v1.0.1 --repo $env:GITHUB_REPOSITORY --pattern 'MiniZip-Dev-1.0.1-Setup-x64.exe*' --dir .cache/previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Dev v1.0.1.' }
          $previous = '.cache/previous-release/MiniZip-Dev-1.0.1-Setup-x64.exe'
          $expected = ((Get-Content -LiteralPath "$previous.sha256" -Raw) -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne $expected) { throw 'Previous installer hash mismatch.' }
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $installer = "release/MiniZip-$($config.channel)-$($config.version)/$($config.installerName)"
          ./scripts/test-installer.ps1 -Installer $installer -PreviousInstaller $previous -PreviousTag dev-v1.0.1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiniZip-Windows-x64
          path: |
            release/**/MiniZip-*-Setup-x64.exe
            release/**/MiniZip-*-Setup-x64.exe.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $installer = Join-Path "release/MiniZip-$($config.channel)-$($config.version)" $config.installerName
          $notes = "releases/$($config.tag).md"
          $flags = @('--title', $config.displayVersion, '--verify-tag')
          if (Test-Path -LiteralPath $notes) { $flags += @('--notes-file', $notes) } else { $flags += '--generate-notes' }
          if ($config.channel -eq 'Dev') { $flags += '--prerelease' }
          gh release create $config.tag $installer "$installer.sha256" @flags
