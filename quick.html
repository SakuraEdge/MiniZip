<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>MiniZip · 快速压缩</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="quick.css" />
  <script src="vendor/lucide.min.js" defer></script>
  <script src="core.js" defer></script>
  <script src="quick.js" defer></script>
</head>
<body>
  <header class="quick-titlebar"><img src="assets/favicon.svg" alt="" /><span>MiniZip</span><span class="divider"></span><strong>快速压缩</strong><span class="version">Dev v1.0.0</span></header>
  <form id="quick-form">
    <div class="quick-body">
      <div class="source-line"><span class="source-icon"><i data-lucide="folder"></i></span><div><h1 id="source-name">正在读取文件…</h1><p id="source-info"></p></div><button class="icon-button" type="button" id="source-detail" title="查看所选项目" aria-label="查看所选项目"><i data-lucide="list"></i></button></div>
      <div id="source-paths" class="source-paths" hidden></div>
      <fieldset id="options" disabled>
        <div class="quick-fields"><label class="name-field">压缩包名称<div class="name-input"><input id="archive-name" autocomplete="off" required maxlength="180" /><span id="extension">.zip</span></div></label><label class="format-field">格式<select id="archive-format"><option value="zip">ZIP</option><option value="7z">7Z</option></select></label></div>
        <label class="destination-field">保存位置<div class="path-input"><input id="quick-destination" readonly required /><button type="button" class="icon-button" id="browse" title="选择保存文件夹" aria-label="选择保存文件夹"><i data-lucide="folder-open"></i></button></div></label>
        <div class="options-row"><label>压缩级别<select id="level"><option value="fast">快速</option><option value="normal" selected>标准</option><option value="maximum">更小体积</option></select></label><label class="password-check"><input type="checkbox" id="encrypt" />密码保护<i data-lucide="lock-keyhole"></i></label></div>
        <div id="password-field" class="password-field" hidden><label for="quick-password">密码</label><div class="path-input"><input type="password" id="quick-password" placeholder="输入密码" autocomplete="off" maxlength="4096" /><button type="button" class="icon-button" id="show-password" title="显示密码" aria-label="显示密码"><i data-lucide="eye"></i></button></div></div>
      </fieldset>
      <div id="progress-area" class="progress-area" hidden><div class="progress-caption"><span id="phase">正在压缩</span><span id="progress-value"></span></div><div class="progress-track"><span id="progress-bar"></span></div></div>
      <p id="quick-error" class="quick-error" role="alert" hidden></p>
      <p id="quick-result" class="quick-result" role="status" hidden></p>
    </div>
    <footer class="quick-footer"><button type="button" id="reveal" class="text-button" hidden><i data-lucide="folder-open"></i>打开所在目录</button><span class="footer-space"></span><button type="button" class="secondary-button" id="cancel">取消</button><button type="submit" class="primary-button" id="submit" disabled><i data-lucide="archive"></i><span>压缩</span></button></footer>
  </form>
</body>
</html>
